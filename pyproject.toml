[project]
name = "mutafix"
version = "0.1.0"
description = "Test-driven repair agent: NVIDIA Nemotron on Nebius Token Factory finds the buggy function, patches it, and runs pytest until the suite is green."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pytest>=8"]

[project.scripts]
mutafix = "mutafix.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mutafix"]
